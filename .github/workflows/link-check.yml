name: Link check

# The only automation in this repository. It runs an off-the-shelf action and
# adds no scripts of its own.
#
# Split into two passes because the two kinds of breakage deserve different
# treatment. Relative paths and #anchors are entirely within this repository,
# so a break is a real bug and blocks. External vendor links 403 automated
# requests and rot on their own schedule, so those are reported and not gated.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch rot in the external documentation the README depends on.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Blocking. A missing file or a stale #anchor is our own mistake, and
      # renaming a heading has silently broken cross-file links here before.
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --verbose --no-progress './**/*.md'
          fail: true
          output: lychee/internal.md

      # Informational. Runs even if the blocking pass failed, so one report
      # does not hide the other.
      - name: Check external links
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 8 './**/*.md'
          fail: false
          jobSummary: true
          output: lychee/external.md
