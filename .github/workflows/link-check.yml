name: Link check

# The only automation in this repository. It runs an off-the-shelf action and
# adds no scripts of its own.
#
# `fail: false` is deliberate. Several vendor documentation sites return 403 to
# automated requests, so a hard failure here would block pull requests for
# reasons unrelated to the change. The job summary reports what it found and a
# human decides whether it matters.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch rot in the external documentation the README depends on.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # The path glob is required; lychee errors without an input.
          #
          # --include-fragments checks #anchors, not just whether the file
          # exists. Renaming a heading has silently broken cross-file links
          # here more than once, and nothing else catches it.
          args: --verbose --no-progress --max-concurrency 8 --include-fragments './**/*.md'
          fail: false
          jobSummary: true
