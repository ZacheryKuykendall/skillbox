apiVersion: skillbox.dev/v1alpha1
kind: workflow

metadata:
  namespace: skillbox
  name: plan-implement-review
  version: 0.1.0
  description: Plans, implements, and reviews a change as an ordered set of steps.
  tags:
    - workflow
    - development
  license: MIT

spec:
  entrypoint: workflow.md
  files:
    - workflow.md
    - README.md
  install:
    target: .skillbox/workflows/plan-implement-review
  steps:
    - name: plan
      uses: skillbox/implementation-planner
      description: Turn the requirement into ordered steps with acceptance checks.
      with:
        requirement: "{{requirement}}"
    - name: implement
      uses: skillbox/implementation-planner
      description: Work through the plan one step at a time, verifying each.
    - name: review
      uses: skillbox/code-review
      description: Review the resulting diff and report severity-ranked findings.
      with:
        severity: medium
    - name: document
      uses: skillbox/technical-documentation
      description: Update the documentation the change affects.
      with:
        document-type: guide
  dependencies:
    - resource: skillbox/implementation-planner
      version: ^0.1.0
    - resource: skillbox/code-review
      version: ^0.1.0
    - resource: skillbox/technical-documentation
      version: ^0.1.0
  inputs:
    - name: requirement
      type: string
      required: true
      description: What needs to be built or changed.
  outputs:
    - name: summary
      type: string
      description: What was planned, built, found in review, and documented.
  permissions:
    - filesystem:read
    - model:invoke
  compatibility:
    skillbox: ">=0.1.0"
